name: Ingest FTC data

# Calls the production ingest endpoint every 15 minutes on weekday afternoons,
# after the FTC's daily update (~noon Eastern). The API's burst throttle allows
# only ~100 requests per run from Vercel, so many short runs cover all states;
# each run skips work already done. Vercel Cron (vercel.json) runs daily as a backup.
#
# Minutes: this repo is public, so GitHub-hosted runners are free. If it went
# private: at most 16 runs x ~22 weekdays x 5 billed minutes = 1,760 min/month
# (typically far less: runs that skip finish in under a minute), under the
# Free plan's 2,000.
on:
  schedule:
    - cron: "*/15 17-20 * * 1-5"
  workflow_dispatch:

concurrency:
  group: ingest-ftc
  cancel-in-progress: false

jobs:
  ingest:
    if: github.repository == 'hawl3y/scam-radar'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call the ingest endpoint
        env:
          CRON_SECRET: ${{ secrets.PROD_CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 320 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://scam-radar.joechawley.com/api/cron/ingest
          echo
