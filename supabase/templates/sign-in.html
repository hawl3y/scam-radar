<!doctype html>
<!-- Paste into Supabase Dashboard → Authentication → Emails, for BOTH
     "Magic Link" and "Confirm signup". Subject: Your ByeBell sign-in link
     Same look as the app's other emails (src/lib/email/layout.ts). -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Your ByeBell sign-in link</title></head>
<body style="margin:0;padding:0;background:#f3f4f6">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f4f6"><tr><td align="center" style="padding:24px 12px">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px"><tr><td style="background:#ffffff;border-radius:12px;padding:28px 24px;font-family:Arial,Helvetica,sans-serif;font-size:18px;line-height:1.5;color:#111827">
  <a href="https://byebell.com" style="color:#1d4ed8;font-size:22px;font-weight:700;text-decoration:none"><img src="https://byebell.com/icon-192.png" width="32" height="32" alt="" style="border:0;border-radius:7px;vertical-align:middle;margin-right:8px">ByeBell</a>
  <h1 style="margin:24px 0 16px;font-size:26px;line-height:1.25;font-weight:700">Sign in to ByeBell</h1>
  <p style="margin:0 0 16px">Tap the button to finish signing in.</p>
  <table role="presentation" cellpadding="0" cellspacing="0" style="margin:28px 0 4px"><tr><td style="border-radius:8px;background:#1d4ed8"><a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=email" style="display:inline-block;padding:14px 28px;border-radius:8px;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;color:#ffffff;text-decoration:none">Sign in</a></td></tr></table>
  <h2 style="margin:32px 0 8px;font-size:14px;line-height:1.4;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#4b5563">Or enter this code</h2>
  <p style="margin:0 0 16px;font-size:30px;font-weight:700;letter-spacing:0.15em">{{ .Token }}</p>
  <p style="margin:0 0 16px;color:#4b5563">Type it in the app if the button opens a different browser.</p>
</td></tr>
<tr><td style="padding:20px 24px 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.6;color:#4b5563">
  <p style="margin:0 0 16px">If you didn't ask to sign in, you can ignore this email.</p>
</td></tr></table>
</td></tr></table>
</body></html>
